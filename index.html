<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved/system theme before styles or React can paint.
      (() => {
        let saved;
        try { saved = localStorage.getItem("meet-theme"); } catch {}
        const theme = saved === "light" || saved === "dark" ? saved :
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f131c" : "#f8fafc");
      })();
    </script>
    <meta name="description" content="Find upcoming events by city and explore their details." />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%meet-favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%meet-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%meet-apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Meet App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
