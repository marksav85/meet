service: auth-server

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs18.x

  region: eu-central-1
  timeout: 30 # optional, in seconds, default is 6

  # you can define service wide environment variables here
  environment:
    CLIENT_ID: ${file(config.json):CLIENT_ID}
    CLIENT_SECRET: ${file(config.json):CLIENT_SECRET}
    CALENDAR_ID: ${file(config.json):CALENDAR_ID}
    # Trusted deployment configuration; never accept arbitrary callback URLs.
    # Add localhost only on the isolated testing stage prepared in a later phase.
    OAUTH_REDIRECT_URIS: ${env:OAUTH_REDIRECT_URIS, '["https://marksav85.github.io/meet/"]'}

# Explicit packaging exclusions protect local configuration and test fixtures.
package:
  patterns:
    - '!config.json'
    - '!test/**'

functions:
  getAuthURL:
    handler: handler.getAuthURL
    events:
      - http:
          path: api/get-auth-url
          method: post
      - http:
          path: api/get-auth-url
          method: options
  getAccessToken:
    handler: handler.getAccessToken
    events:
      - http:
          path: api/token
          method: post
      - http:
          path: api/token
          method: options
  getCalendarEvents:
    handler: handler.getCalendarEvents
    events:
      - http:
          path: api/get-events
          method: get
      - http:
          path: api/get-events
          method: options
