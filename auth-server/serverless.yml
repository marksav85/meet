service: auth-server

frameworkVersion: "4.43.0"

# Unsupported stages fail variable resolution, including legacy /dev.
custom:
  allowedStages:
    localtest: localtest
  selectedStage: ${self:custom.allowedStages.${opt:stage, 'localtest'}}

build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${self:custom.selectedStage}
  logRetentionInDays: 14
  # Do not enable API Gateway full request/response execution logging.
  logs:
    restApi: false

  region: eu-central-1
  timeout: 30 # optional, in seconds, default is 6

  # you can define service wide environment variables here
  environment:
    CLIENT_ID: ${env:CLIENT_ID}
    CLIENT_SECRET: ${env:CLIENT_SECRET}
    CALENDAR_ID: ${env:CALENDAR_ID}
    # Trusted deployment configuration; never accept arbitrary callback URLs.
    # Add localhost only on the isolated testing stage prepared in a later phase.
    OAUTH_REDIRECT_URIS: ${env:OAUTH_REDIRECT_URIS, '["https://marksav85.github.io/meet/"]'}

# Explicit packaging exclusions protect local configuration and test fixtures.
package:
  patterns:
    - '!**'
    - 'handler.js'
    - 'node_modules/**'
    - '!node_modules/.cache/**'
    # Runtime JS retained; SDK declarations/source maps are not needed in Lambda.
    - '!node_modules/**/*.d.ts'
    - '!node_modules/**/*.map'

functions:
  getAuthURL:
    handler: handler.getAuthURL
    events:
      - http:
          path: api/get-auth-url
          method: post
      - http:
          path: api/get-auth-url
          method: options
  getAccessToken:
    handler: handler.getAccessToken
    events:
      - http:
          path: api/token
          method: post
      - http:
          path: api/token
          method: options
  getCalendarEvents:
    handler: handler.getCalendarEvents
    events:
      - http:
          path: api/get-events
          method: get
      - http:
          path: api/get-events
          method: options
